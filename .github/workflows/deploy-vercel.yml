name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - dev
      - test
      - "test/**"
      - "test-*"
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        type: choice
        options:
          - preview
          - production
        default: preview

# One deployment at a time per branch. A newer push supersedes an in-flight
# deployment of the same branch instead of racing it.
concurrency:
  group: deploy-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve the deployment target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            deployment_target="${{ inputs.target }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            deployment_target="production"
          else
            deployment_target="preview"
          fi
          echo "deployment_target=${deployment_target}" >> "$GITHUB_OUTPUT"
          echo "Deploying branch '${{ github.ref_name }}' to the ${deployment_target} environment."

      - name: Install the Vercel CLI
        run: npm install --global vercel@latest

      # Pulls the project settings and the VITE_* environment variables that the
      # Vite build inlines at build time, so they are never duplicated into
      # GitHub secrets.
      - name: Pull the Vercel environment configuration
        run: vercel pull --yes --environment=${{ steps.target.outputs.deployment_target }} --git-branch=${{ github.ref_name }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build the project artifacts
        run: vercel build ${{ steps.target.outputs.deployment_target == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy the prebuilt artifacts to Vercel
        id: deploy
        run: |
          deployment_url="$(vercel deploy --prebuilt ${{ steps.target.outputs.deployment_target == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})"
          echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"

      # Gives non-production branches the stable, human-readable hostname that
      # the Vercel Git integration would otherwise assign, so
      # neural-nexus-git-<branch>-<scope>.vercel.app always points at the newest
      # deployment of that branch.
      - name: Assign the branch alias
        if: steps.target.outputs.deployment_target == 'preview'
        run: |
          branch_slug="$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed 's/-\+/-/g; s/^-//; s/-$//')"
          branch_alias="${{ vars.VERCEL_PREVIEW_ALIAS_PREFIX || 'neural-nexus-git' }}-${branch_slug}-${{ vars.VERCEL_ALIAS_SCOPE || 'efwoods-projects' }}.vercel.app"
          echo "Aliasing ${{ steps.deploy.outputs.deployment_url }} to ${branch_alias}"
          vercel alias set "${{ steps.deploy.outputs.deployment_url }}" "${branch_alias}" --token=${{ secrets.VERCEL_TOKEN }}

      - name: Write the deployment summary
        run: |
          {
            echo "### Vercel deployment"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Environment | ${{ steps.target.outputs.deployment_target }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Deployment URL | ${{ steps.deploy.outputs.deployment_url }} |"
          } >> "$GITHUB_STEP_SUMMARY"
