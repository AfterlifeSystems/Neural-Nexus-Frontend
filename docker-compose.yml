services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: react-vite-dev
    ports:
      - "5173:5173"
    volumes:
      - ./:/app:cached
      - /app/node_modules
    env_file:
      - .env.development
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=100
    stdin_open: true
    tty: true
    restart: unless-stopped
    command: ["npm", "run", "dev", "--", "--host"]