<!DOCTYPE html>
<html>
<head>
    <title>S3 CORS Test</title>
</head>
<body>
    <h1>S3 CORS Header Test</h1>
    <p>Open browser DevTools Network tab and check the response headers</p>
    <button onclick="testCORS()">Test CORS Headers</button>
    <div id="result"></div>

    <script>
        async function testCORS() {
            // Use one of your actual S3 URLs from the error
            const testUrl = 'https://neural-nexus-s3.s3.amazonaws.com/users/10ffa55f-17cd-4b06-9888-5a7f473d8007/avatars/69106c1e-4b1f-47b3-8266-0111e154d9a3/icon/325cddc1-1ab8-49c2-812e-cfa73addf176_professional_headshot.jpeg?AWSAccessKeyId=AKIAR5BLOKFQGGVXEZ64&Signature=uCdQF22WH2ztRpzDAkGMO4yoNx8%3D&Expires=1767902573';
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Testing CORS headers...</p>';
            
            try {
                // Test with fetch to see headers
                const response = await fetch(testUrl, {
                    method: 'HEAD', // Use HEAD to avoid downloading the image
                    mode: 'cors'
                });
                
                const headers = {};
                response.headers.forEach((value, key) => {
                    headers[key] = value;
                });
                
                const hasCORS = 'access-control-allow-origin' in headers;
                
                resultDiv.innerHTML = `
                    <h3>Response Headers:</h3>
                    <pre>${JSON.stringify(headers, null, 2)}</pre>
                    <h3>CORS Status:</h3>
                    <p style="color: ${hasCORS ? 'green' : 'red'}; font-weight: bold;">
                        ${hasCORS ? '✓ CORS header present' : '✗ NO CORS header found'}
                    </p>
                    ${hasCORS ? 
                        `<p>Access-Control-Allow-Origin: ${headers['access-control-allow-origin']}</p>` :
                        '<p>This is why images fail to load in WebGL!</p>'
                    }
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <p style="color: red;">Error: ${error.message}</p>
                    <p>Check the Network tab in DevTools to see the actual response headers</p>
                `;
            }
        }
    </script>
</body>
</html>
